# ----------------------------
# Stage 1 concept-family collapse rules
# Format: label = CRF Name | CDE Name
# ----------------------------
[ConceptFamilies]
family_1 = Demographics | Race
family_2 = Demographics | Parent Race
family_3 = Demographics | Race child
family_4 = Adult Demographics | SDOH

[FidelityThresholds]
high = 80
medium = 50

[ConceptWeights]
var_name_weight = 0.25
field_label_weight = 0.50
form_context_weight = 0.15
crf_context_weight = 0.10

# ----------------------------
# Copyright-sensitive / protected primary family rules
# These rules prevent cross-family proxy candidates from becoming the primary Best Match.
#
# Format:
# expected_crf_label = allowed_primary_candidate_1 | allowed_primary_candidate_2 | ...
#
# If the row's expected CRF is listed on the left, then the primary Best Match
# must come from one of the allowed CRF labels on the right.
# Cross-family candidates may still appear as reviewable alternatives, but
# should not be accepted as the main Best Match.
# ----------------------------
[ProtectedPrimaryFamilies]
brief pain inventory (bpi) = brief pain inventory (bpi) | bpi | brief pain inventory
bpi pain interference = bpi pain interference | bpi interference | brief pain inventory (bpi) | bpi | pain interference
bpi pain severity = bpi pain severity | bpi severity | brief pain inventory (bpi) | bpi | pain severity
pcs-6 = pcs-6 | pcs6 | pain catastrophizing scale 6 | pain catastrophizing scale-6 | pcs 6
pcs-13 = pcs-13 | pcs13 | pain catastrophizing scale 13 | pain catastrophizing scale-13 | pcs 13
pedsql inventory = pedsql inventory | pedsql | pedsql pediatric quality of life inventory | pediatric quality of life inventory

[SkipVLMDMatchingCRFs]
bpi = true
brief pain inventory (bpi) = true
bpi pain interference = true
bpi pain severity = false
pcs-6 = true
pcs6 = true
pcs-13 = true
pcs13 = true
pedsql inventory = true
pedsql (pediatric quality of life inventory) = true
pedsql = true

## LLM calls
[Models]
PRESTEP_MODEL = gpt-4.1-mini
HARMONIZER_MODEL = gpt-4.1-mini
MATCHING_MODEL = gpt-4.1-mini

[ReconSettings]
enabled = true
eligible_concept_statuses = High concept match | Possible concept match
max_rows =
dry_run = false

[Instructions]
# Prestep
crf_id_prestep = You are an expert data steward. Your task is to identify the correct Case Report Form (CRF) name for a given variable description using current form and variable naming conventions.
    General CRF identification guidelines:
        - When you receive an abbreviated or partial CRF name, match it to the full, official form name to the best of your ability.
        - Leverage the name and descriptions of the variable to infer context, themes, and intent.
        - Apply semantic understanding to resolve partial or fuzzy descriptions.
    Please STRICTLY adhere to return ONLY a JSON object with exactly these two keys:
        - CRF: a unique, concise label for this CRF
        - Rationale: One brief sentence explaining your choice
    Do NOT add any introductory text, markdown formatting, or extra commentary.
form_harmonizer = You are a metadata harmonizer for clinical study forms.
    You will receive a JSON array of objects each with original and rationale keys
    Your task is to
    - Review all original form names and rationales together
    - Group entries that clearly belong to the same logical form based on shared themes or context
    - Group together minor variations (spacing, case, underscores, etc)
    - For each group invent a single concise label that best describes that cluster
    - Favor clear, human-friendly names
    - Use AS FEW LABELS as needed to cover all inputs
    - Map every original name to its invented cluster label
    Output will
    - Invoke the harmonize_crf_names function only
    - Provide a mapping object from original form names to their cluster labels
    - Do not return any other text
matching_instruction = You are an expert data steward. Your task is to determine whether a given refined Case Report Form (CRF) name and its associated variable descriptions correspond to exactly one HEAL Core CRF in the vector store (or none). Follow these hard rules:
    STRICTLY adhere to this response format, no extra text or markdown:
    - HEAL Core CRF Match: Your chosen HEAL CDE or No CRF match
    - Confidence level: Your chosen confidence level
    - Rationale: one sentence short explanation of your justifications
    ABSOLUTE Caution
    - Err on the side of caution. When unsure, prefer No CRF match. Not match default unless evidence is strong.
    - Only match if the CRF name exactly equals one of the HEAL Core CRF names. No partial or thematic matches.
    - If the description fails to reinforce the domain, return NO CRF match.
    NO INVENTION
    - Only respond with matches from this list of HEAL Core CRFs (as found in the vector store) and do NOT invent or infer names outside of this list (stored in the vector store as vs_67dbd4f7596c819192ddb860daafca24):
        - Brief Pain Inventory (BPI)
        - BPI Pain Interference
        - BPI Pain Severity
        - Demographics
        - GAD2 Pain (Generalized Anxiety Disorder)
        - GAD7
        - NIDAL2 (NIDA Modified ASSIST L2)
        - PCS6 (Pain Catastrophizing Scale)
        - PCS13
        - PCS Child
        - PCS Parent
        - PedsQL (Pediatric Quality of Life Inventory)
        - PEG Pain
        - PGIC Pain(Patient Global Impression of Change Pain)
        - PGIS (Patient Global Impression of Severity)
        - PHQ2 (Patient Health Questionnaire 2)
        - PHQ8
        - PHQ9
        - PROMIS PF Pain (PROMIS Physical Function Pain)
        - PROMIS Sleep Disturbance 6a
        - Sleep Duration Pain
        - SleepASWS (Adolescent Sleep Wake Scale)
        - TAPS Pain
        - WHOQOL2
    Response Guidance:
    - For each CRF name and description, return the most likely HEAL Core CRF match (if applicable) along with a confidence score.
    - If no match is found (if neither the CRF nor the descriptions resemble any HEAL Core CRF or its relevant themes):
        - return No CRF match
    - When in doubt, prefer No CRF match

# Reconciliation / adjudication step
recon_adjudication_instruction = You are an expert metadata steward reviewing candidate HEAL Common Data Element matches.
    Your task is to choose the best official HEAL CDE match for one study data dictionary row, using only the provided candidate matches and row context.
    You must not invent new CDE names, CRF names, or variable names.
    Choose from the provided candidate list only.
    If none of the candidates are appropriate, return No Match.
    Do not accept a candidate based only on similar permissible values or numeric scale ranges.
    The candidate must also align with the study row concept, CRF/form context, and question/definition meaning.
    Prefer candidates supported by multiple signals, including:
        - the study variable name
        - the study form name
        - the field label or question text
        - permissible values or encoding labels
        - the HEAL Core CRF Match from the pre-step
        - concept match status
        - encoding fidelity score
        - protected family rule notes, when available
    Treat protected family rule notes as important guardrails.
    When a protected family rule indicates that a primary candidate was blocked, do not choose that blocked candidate unless the candidate list explicitly supports it and the row context strongly justifies it.
    Return ONLY valid JSON with exactly these keys:
        - best_best_match_cde
        - best_best_match_crf
        - best_best_match_variable
        - recon_decision
        - recon_confidence
        - recon_rationale
    Allowed recon_decision values:
        - Accept Candidate
        - No Match
        - Needs Human Review
    Allowed recon_confidence values:
        - High
        - Medium
        - Low
    The recon_rationale must be one brief sentence.